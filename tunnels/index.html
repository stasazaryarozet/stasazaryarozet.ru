<html lang="ru">
<head>

<title>Тоннели Системы · QR</title>

<style>
    :root {
      --bg: #0f1216;
      --surface: #171c22;
      --surface-alt: #1f2630;
      --border: #2c3644;
      --ink: #eef2f6;
      --muted: #9aa7b8;
      --accent: #66b3ff;
      --accent-ink: #08131f;
      --ok: #5dd39e;
      --warn: #f4b860;
      --danger: #f07178;
      --radius: clamp(10px, 1.5vw, 16px);
      --pad: clamp(12px, 2.6vw, 24px);
      --gap: clamp(10px, 1.8vw, 18px);
      --fs-body: clamp(0.92rem, 0.88rem + 0.25vw, 1.02rem);
      --fs-sm: clamp(0.78rem, 0.75rem + 0.18vw, 0.88rem);
      --fs-h1: clamp(1.18rem, 1.04rem + 0.75vw, 1.65rem);
      --fs-h2: clamp(1.02rem, 0.96rem + 0.35vw, 1.25rem);
      --qr-size: clamp(210px, 56vw, 292px);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="night"]) {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --surface-alt: #eef2f7;
        --border: #cfd8e3;
        --ink: #121821;
        --muted: #4b5a6d;
        --accent: #0b5ed7;
        --accent-ink: #ffffff;
        --ok: #146c43;
        --warn: #9a5b00;
        --danger: #b42318;
      }
    }
    :root[data-theme="day"] {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #eef2f7;
      --border: #cfd8e3;
      --ink: #121821;
      --muted: #4b5a6d;
      --accent: #0b5ed7;
      --accent-ink: #ffffff;
      --ok: #146c43;
      --warn: #9a5b00;
      --danger: #b42318;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: var(--fs-body);
      line-height: 1.48;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: clamp(12px, 2.5vw, 28px) clamp(10px, 2.5vw, 24px) clamp(24px, 4vw, 48px);
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: var(--gap);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: -0.015em;
      overflow-wrap: anywhere;
    }
    .meta-line {
      font-size: var(--fs-sm);
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      font-size: var(--fs-sm);
      color: var(--muted);
      white-space: nowrap;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button, input {
      font: inherit;
      color: inherit;
    }
    .btn {
      appearance: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: var(--fs-sm);
      font-weight: 600;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .btn:hover, .btn:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--pad);
    }
    .lock-card {
      max-width: 480px;
      margin: clamp(18px, 6vh, 64px) auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .lock-card h2 {
      margin: 0;
      font-size: var(--fs-h2);
    }
    .lock-card p {
      margin: 0;
      color: var(--muted);
      font-size: var(--fs-sm);
    }
    .key-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .key-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs-sm);
    }
    .err-msg {
      color: var(--danger);
      font-size: var(--fs-sm);
      min-height: 1.2em;
    }
    .exit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      gap: 8px;
      margin-bottom: var(--gap);
    }
    .exit-tab {
      appearance: none;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      min-width: 0;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .exit-tab:hover, .exit-tab:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    .exit-tab[aria-selected="true"] {
      border-color: var(--accent);
      background: var(--surface-alt);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .exit-tab-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: var(--fs-body);
      min-width: 0;
    }
    .exit-tab-name {
      overflow-wrap: anywhere;
      line-height: 1.25;
    }
    .exit-tab-sub {
      font-size: var(--fs-sm);
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .stage {
      display: grid;
      grid-template-columns: minmax(0, auto) minmax(0, 1fr);
      gap: clamp(16px, 3vw, 28px);
      align-items: start;
    }
    @media (max-width: 680px) {
      .stage {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .qr-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qr-frame {
      width: var(--qr-size);
      max-width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .details {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .exit-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }
    .exit-title-row h2 {
      margin: 0;
      font-size: var(--fs-h2);
      overflow-wrap: anywhere;
    }
    .hop-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hop-caption {
      font-size: var(--fs-sm);
      color: var(--muted);
      font-weight: 600;
    }
    .hop-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hop-pill {
      appearance: none;
      cursor: pointer;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--ink);
      font-size: var(--fs-sm);
      font-weight: 600;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .hop-pill:hover, .hop-pill:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    .hop-pill[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .hint {
      margin: 0;
      font-size: var(--fs-sm);
      color: var(--warn);
    }
    .hint-ok {
      color: var(--ok);
    }
    .specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
      margin: 0;
    }
    .spec-item {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 0;
    }
    .spec-item dt {
      font-size: var(--fs-sm);
      color: var(--muted);
      margin: 0 0 2px;
    }
    .spec-item dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs-sm);
      overflow-wrap: anywhere;
    }
    .uri-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .btn-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy-status {
      font-size: var(--fs-sm);
      color: var(--ok);
    }
    details.raw-uri {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    details.raw-uri summary {
      cursor: pointer;
      font-size: var(--fs-sm);
      color: var(--muted);
      font-weight: 600;
    }
    .uri-code {
      width: 100%;
      margin: 8px 0 0;
      padding: 10px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      line-height: 1.4;
      resize: vertical;
      max-width: 100%;
    }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .btn, .exit-tab, .hop-pill {
        transition: none;
      }
    }
  </style>
</head>

<script src="/qrcode.js"></script>
<script>
    (function () {
      "use strict";
      var STORAGE_KEY = "dela_tunnels_portal_key_v1";
      var THEME_KEY = "theme.v1";
      var THEME_ATTR = "data-theme";
      var DAY_VAL = "day";
      var NIGHT_VAL = "night";
      var envelope = JSON.parse(document.getElementById("tunnels-envelope").textContent);
      var lockView = document.getElementById("lock-view");
      var appView = document.getElementById("app-view");
      var lockBtn = document.getElementById("lock-btn");
      var lockErr = document.getElementById("lock-err");
      var keyForm = document.getElementById("key-form");
      var keyInput = document.getElementById("key-input");
      var themeBtn = document.getElementById("theme-btn");
      var exitTabs = document.getElementById("exit-tabs");
      var hopPills = document.getElementById("hop-pills");
      var qrFrame = document.getElementById("qr-frame");
      var routeBadge = document.getElementById("route-badge");
      var exitTitle = document.getElementById("exit-title");
      var exitRoleBadge = document.getElementById("exit-role-badge");
      var routeHint = document.getElementById("route-hint");
      var specDial = document.getElementById("spec-dial");
      var specSni = document.getElementById("spec-sni");
      var specProto = document.getElementById("spec-proto");
      var specTransport = document.getElementById("spec-transport");
      var uriCode = document.getElementById("uri-code");
      var openUriLink = document.getElementById("open-uri-link");
      var openHappLink = document.getElementById("open-happ-link");
      var openHiddifyLink = document.getElementById("open-hiddify-link");
      var copyBtn = document.getElementById("copy-btn");
      var copyStatus = document.getElementById("copy-status");

      var state = { model: null, exitId: "", routeByExit: {} };

      function __applyTheme(t) {
        var val = (t === DAY_VAL || t === NIGHT_VAL)
          ? t
          : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? DAY_VAL : NIGHT_VAL);
        document.documentElement.setAttribute(THEME_ATTR, val);
        return val;
      }
      window.__applyTheme = __applyTheme;
      (function initTheme() {
        var saved = "";
        try { saved = localStorage.getItem(THEME_KEY) || ""; } catch (_e) {}
        __applyTheme(saved);
      })();
      themeBtn.addEventListener("click", function () {
        var cur = document.documentElement.getAttribute(THEME_ATTR);
        var next = cur === NIGHT_VAL ? DAY_VAL : NIGHT_VAL;
        __applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (_e) {}
      });

      function b64uToBytes(str) {
        var norm = String(str || "").trim().replace(/-/g, "+").replace(/_/g, "/");
        while (norm.length % 4) norm += "=";
        var bin = atob(norm);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function decryptModel(keyStr) {
        var keyBytes = b64uToBytes(keyStr);
        if (keyBytes.length !== 32) throw new Error("Неверная длина ключа");
        var cryptoKey = await crypto.subtle.importKey(
          "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]
        );
        var iv = b64uToBytes(envelope.iv);
        var ct = b64uToBytes(envelope.ct);
        var aad = new TextEncoder().encode(envelope.aad || "dela-tunnels-portal-v1");
        var pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv, additionalData: aad }, cryptoKey, ct
        );
        return JSON.parse(new TextDecoder().decode(pt));
      }

      function renderQr(uri) {
        qrFrame.innerHTML = "";
        if (typeof window.qrcode !== "function") {
          qrFrame.textContent = "QR-модуль недоступен";
          return;
        }
        window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs["UTF-8"];
        var qr = window.qrcode(0, "M");
        qr.addData(uri, "Byte");
        qr.make();
        qrFrame.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      }

      function currentExit() {
        if (!state.model || !state.model.exits.length) return null;
        for (var i = 0; i < state.model.exits.length; i++) {
          if (state.model.exits[i].id === state.exitId) return state.model.exits[i];
        }
        return state.model.exits[0];
      }

      function currentRoute(ex) {
        if (!ex || !ex.routes.length) return null;
        var wanted = state.routeByExit[ex.id] || ex.default_route;
        for (var i = 0; i < ex.routes.length; i++) {
          if (ex.routes[i].id === wanted) return ex.routes[i];
        }
        return ex.routes[0];
      }

      function renderExitTabs() {
        exitTabs.innerHTML = "";
        state.model.exits.forEach(function (ex) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "exit-tab";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", ex.id === state.exitId ? "true" : "false");

          var head = document.createElement("div");
          head.className = "exit-tab-head";
          var flag = document.createElement("span");
          flag.textContent = ex.flag;
          var name = document.createElement("span");
          name.className = "exit-tab-name";
          name.textContent = ex.id;
          head.appendChild(flag);
          head.appendChild(name);

          var sub = document.createElement("div");
          sub.className = "exit-tab-sub";
          sub.textContent = ex.country_name + " · " + (ex.direct_allowed ? "прямой / хоп" : "только через хоп");

          btn.appendChild(head);
          btn.appendChild(sub);
          btn.addEventListener("click", function () {
            state.exitId = ex.id;
            renderAll();
          });
          exitTabs.appendChild(btn);
        });
      }

      function renderStage() {
        var ex = currentExit();
        if (!ex) return;
        var rt = currentRoute(ex);
        if (!rt) return;

        exitTitle.textContent = ex.flag + " " + ex.name;
        exitRoleBadge.textContent = ex.is_hop ? "Выход + хоп" : "Выход";
        routeBadge.textContent = rt.label;

        hopPills.innerHTML = "";
        ex.routes.forEach(function (r) {
          var pill = document.createElement("button");
          pill.type = "button";
          pill.className = "hop-pill";
          pill.setAttribute("aria-pressed", r.id === rt.id ? "true" : "false");
          pill.textContent = r.label;
          pill.addEventListener("click", function () {
            state.routeByExit[ex.id] = r.id;
            renderStage();
          });
          hopPills.appendChild(pill);
        });

        if (!ex.direct_allowed) {
          routeHint.className = "hint";
          routeHint.textContent = "Прямой вход из РФ заблокирован — доступны только внешние хопы.";
        } else if (rt.kind === "direct") {
          routeHint.className = "hint hint-ok";
          routeHint.textContent = "Прямой заход из РФ работает; при желании можно выбрать любой хоп.";
        } else {
          routeHint.className = "hint hint-ok";
          routeHint.textContent = "Соединение идёт через хоп " + (rt.hop_name || rt.id) + " (сквозное шифрование до выхода).";
        }

        specDial.textContent = rt.dial || "—";
        specSni.textContent = rt.sni || "—";
        specProto.textContent = rt.protocol || "—";
        specTransport.textContent = rt.transport || "—";
        uriCode.value = rt.uri;
        openUriLink.setAttribute("href", rt.uri);
        openHappLink.setAttribute("href", "happ://add/" + rt.uri);
        openHiddifyLink.setAttribute("href", "hiddify://import/" + rt.uri);
        copyStatus.textContent = "";
        renderQr(rt.uri);
      }

      function renderAll() {
        renderExitTabs();
        renderStage();
      }

      async function unlockWith(rawKey, persist) {
        lockErr.textContent = "";
        try {
          var model = await decryptModel(rawKey);
          state.model = model;
          state.exitId = model.exits.length ? model.exits[0].id : "";
          if (persist) {
            try { localStorage.setItem(STORAGE_KEY, rawKey.trim()); } catch (_e) {}
          }
          document.getElementById("count-badge").textContent = model.exits.length + " выходов";
          if (model.rev) {
            document.getElementById("rev-badge").textContent = "rev " + model.rev;
          }
          lockView.classList.add("hidden");
          appView.classList.remove("hidden");
          lockBtn.classList.remove("hidden");
          renderAll();
          return true;
        } catch (_err) {
          lockErr.textContent = "Ключ не подошёл или повреждён.";
          return false;
        }
      }

      copyBtn.addEventListener("click", function () {
        var ex = currentExit();
        var rt = currentRoute(ex);
        if (!rt) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(rt.uri).then(function () {
            copyStatus.textContent = "Скопировано";
          }).catch(function () {
            copyStatus.textContent = "Откройте URI ниже и скопируйте вручную";
          });
        } else {
          copyStatus.textContent = "Откройте URI ниже и скопируйте вручную";
        }
      });

      lockBtn.addEventListener("click", function () {
        try { localStorage.removeItem(STORAGE_KEY); } catch (_e) {}
        state.model = null;
        keyInput.value = "";
        lockErr.textContent = "";
        appView.classList.add("hidden");
        lockBtn.classList.add("hidden");
        lockView.classList.remove("hidden");
      });

      keyForm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var k = keyInput.value.trim();
        if (!k) {
          lockErr.textContent = "Введите ключ.";
          return;
        }
        unlockWith(k, true);
      });

      (async function boot() {
        var hashKey = "";
        if (window.location.hash && window.location.hash.length > 1) {
          hashKey = decodeURIComponent(window.location.hash.slice(1)).trim();
          if (hashKey.indexOf("k=") === 0) hashKey = hashKey.slice(2);
          try {
            window.history.replaceState(null, "", window.location.pathname + window.location.search);
          } catch (_e) {}
        }
        if (hashKey) {
          var ok = await unlockWith(hashKey, true);
          if (ok) return;
        }
        var saved = "";
        try { saved = localStorage.getItem(STORAGE_KEY) || ""; } catch (_e) {}
        if (saved) {
          await unlockWith(saved, false);
        }
      })();
    })();
  </script>
</body>
</html>
