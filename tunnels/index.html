<script src="/qrcode.js"></script>
<script>
    (function () {
      "use strict";
      var STATES = ["auto", "day", "night"];
      var GLYPHS = {"auto": "◐", "day": "☀", "night": "☾"};
      var LABELS = {"auto": "Тема: авто (по солнцу)", "day": "Тема: дневная", "night": "Тема: ночная"};
      var STORAGE_KEY = "theme.v1";
      var MODE_VALUES = ["day", "night"];
      var MODE_ATTR = "data-theme";
      var SUFFIX = " — переключить";
      var themeBtn = document.querySelector("[data-theme-toggle]");
      if (themeBtn) {
        var currentThemeState = function () {
          var s = null;
          try { s = localStorage.getItem(STORAGE_KEY); } catch (_e) {}
          return MODE_VALUES.indexOf(s) !== -1 ? s : STATES[0];
        };
        var paintToggle = function (st) {
          themeBtn.textContent = GLYPHS[st] || GLYPHS[STATES[0]];
          themeBtn.setAttribute("aria-label", (LABELS[st] || LABELS[STATES[0]]) + SUFFIX);
        };
        paintToggle(currentThemeState());
        themeBtn.addEventListener("click", function () {
          var seen = null;
          try { seen = document.documentElement.getAttribute(MODE_ATTR); } catch (_e) {}
          var i = MODE_VALUES.indexOf(seen);
          var next = MODE_VALUES[(i + 1) % MODE_VALUES.length];
          try { localStorage.setItem(STORAGE_KEY, next); } catch (_e) {}
          if (window.__applyTheme) window.__applyTheme(next);
          paintToggle(next);
        });
      }

      var REFRESH_CFG = {"interval_ms": 30000, "max_backoff_ms": 300000, "min_gap_ms": 5000, "notice_ms": 6000, "data_script_id": "tunnels-data", "view_attr": "data-portal-view"};
      var dataScript = document.getElementById(REFRESH_CFG.data_script_id);
      var model = JSON.parse(dataScript.textContent);
      var exitTabs = document.getElementById("exit-tabs");
      var hopPills = document.getElementById("hop-pills");
      var qrFrame = document.getElementById("qr-frame");
      var routeBadge = document.getElementById("route-badge");
      var exitTitle = document.getElementById("exit-title");
      var exitRoleBadge = document.getElementById("exit-role-badge");
      var routeHint = document.getElementById("route-hint");
      var specDial = document.getElementById("spec-dial");
      var specSni = document.getElementById("spec-sni");
      var specProto = document.getElementById("spec-proto");
      var specTransport = document.getElementById("spec-transport");
      var uriCode = document.getElementById("uri-code");
      var openUriLink = document.getElementById("open-uri-link");
      var openHappLink = document.getElementById("open-happ-link");
      var openHiddifyLink = document.getElementById("open-hiddify-link");
      var copyBtn = document.getElementById("copy-btn");
      var copyStatus = document.getElementById("copy-status");
      var updateNotice = document.getElementById("update-notice");

      function modelContentKey(m) {
        return JSON.stringify({
          exits: (m && Array.isArray(m.exits)) ? m.exits : [],
          hops: (m && Array.isArray(m.hops)) ? m.hops : []
        });
      }

      var state = {
        model: model,
        contentKey: modelContentKey(model),
        exitId: (model && model.exits && model.exits.length) ? model.exits[0].id : "",
        routeByExit: {}
      };

      function renderQr(uri) {
        qrFrame.innerHTML = "";
        if (typeof window.qrcode !== "function") {
          qrFrame.textContent = "QR-модуль недоступен";
          return;
        }
        window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs["UTF-8"];
        var qr = window.qrcode(0, "M");
        qr.addData(uri, "Byte");
        qr.make();
        qrFrame.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      }

      function currentExit() {
        if (!state.model || !state.model.exits || !state.model.exits.length) return null;
        for (var i = 0; i < state.model.exits.length; i++) {
          if (state.model.exits[i].id === state.exitId) return state.model.exits[i];
        }
        return state.model.exits[0];
      }

      function currentRoute(ex) {
        if (!ex || !ex.routes || !ex.routes.length) return null;
        var wanted = state.routeByExit[ex.id] || ex.default_route;
        for (var i = 0; i < ex.routes.length; i++) {
          if (ex.routes[i].id === wanted) return ex.routes[i];
        }
        return ex.routes[0];
      }

      function appendTextKeepParens(el, text) {
        String(text || "").split(/(\([^)]+\))/).forEach(function (part) {
          if (!part) return;
          if (part.charAt(0) === "(" && part.charAt(part.length - 1) === ")") {
            var sp = document.createElement("span");
            sp.className = "nowrap";
            sp.textContent = part;
            el.appendChild(sp);
          } else {
            el.appendChild(document.createTextNode(part));
          }
        });
      }

      function renderExitTabs() {
        exitTabs.innerHTML = "";
        state.model.exits.forEach(function (ex) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "exit-tab";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", ex.id === state.exitId ? "true" : "false");

          var head = document.createElement("div");
          head.className = "exit-tab-head";
          var flag = document.createElement("span");
          flag.textContent = ex.flag;
          var name = document.createElement("span");
          name.className = "exit-tab-name";
          appendTextKeepParens(name, ex.tab_label || ex.id);
          head.appendChild(flag);
          head.appendChild(name);

          var sub = document.createElement("div");
          sub.className = "exit-tab-sub";
          var subCountry = document.createElement("span");
          subCountry.textContent = ex.country_name;
          var subMode = document.createElement("span");
          subMode.textContent = ex.direct_allowed ? "прямой / хоп" : "только через хоп";
          sub.appendChild(subCountry);
          sub.appendChild(subMode);

          btn.appendChild(head);
          btn.appendChild(sub);
          btn.addEventListener("click", function () {
            state.exitId = ex.id;
            renderAll();
          });
          exitTabs.appendChild(btn);
        });
      }

      function renderStage() {
        var ex = currentExit();
        if (!ex) return;
        var rt = currentRoute(ex);
        if (!rt) return;

        exitTitle.textContent = ex.flag + " " + ex.name;
        var baseRole = ex.is_hop ? "Выход + хоп" : "Выход";
        exitRoleBadge.textContent = (ex.services && ex.services.length)
          ? ex.services.map(function (s) { return s.label; }).join(" · ") + " · " + baseRole
          : baseRole;
        routeBadge.textContent = rt.label;

        hopPills.innerHTML = "";
        ex.routes.forEach(function (r) {
          var pill = document.createElement("button");
          pill.type = "button";
          pill.className = "hop-pill";
          pill.setAttribute("aria-pressed", r.id === rt.id ? "true" : "false");
          pill.textContent = r.label;
          pill.addEventListener("click", function () {
            state.routeByExit[ex.id] = r.id;
            renderStage();
          });
          hopPills.appendChild(pill);
        });

        if (!ex.direct_allowed) {
          routeHint.textContent = "Прямой вход из РФ заблокирован — доступны только внешние хопы.";
        } else if (rt.kind === "direct") {
          routeHint.textContent = "Прямой заход из РФ работает; при желании можно выбрать любой хоп.";
        } else {
          routeHint.textContent = "Соединение идёт через хоп " + (rt.hop_name || rt.id) + " (сквозное шифрование до выхода).";
        }

        specDial.textContent = rt.dial || "—";
        specSni.textContent = rt.sni || "—";
        specProto.textContent = rt.protocol || "—";
        specTransport.textContent = rt.transport || "—";
        uriCode.value = rt.uri;
        openUriLink.setAttribute("href", rt.uri);
        openHappLink.setAttribute("href", "happ://add/" + rt.uri);
        openHiddifyLink.setAttribute("href", "hiddify://import/" + rt.uri);
        copyStatus.textContent = "";
        renderQr(rt.uri);
      }

      function renderAll() {
        renderExitTabs();
        renderStage();
      }

      copyBtn.addEventListener("click", function () {
        var ex = currentExit();
        var rt = currentRoute(ex);
        if (!rt) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(rt.uri).then(function () {
            copyStatus.textContent = "Скопировано";
          }).catch(function () {
            copyStatus.textContent = "Откройте ссылку ниже и скопируйте вручную";
          });
        } else {
          copyStatus.textContent = "Откройте ссылку ниже и скопируйте вручную";
        }
      });

      var noticeTimer = null;
      function showUpdateNotice(rev) {
        if (!updateNotice) return;
        updateNotice.textContent = rev ? ("Обновлено · " + rev) : "Конфигурация обновлена";
        updateNotice.hidden = false;
        if (noticeTimer) window.clearTimeout(noticeTimer);
        noticeTimer = window.setTimeout(function () {
          updateNotice.hidden = true;
          noticeTimer = null;
        }, REFRESH_CFG.notice_ms);
      }

      function reconcileSelection(nextModel) {
        var exits = (nextModel && Array.isArray(nextModel.exits)) ? nextModel.exits : [];
        var byId = {};
        exits.forEach(function (ex) { byId[ex.id] = ex; });
        if (!byId[state.exitId]) {
          state.exitId = exits.length ? exits[0].id : "";
        }
        Object.keys(state.routeByExit).forEach(function (eid) {
          var ex = byId[eid];
          if (!ex || !Array.isArray(ex.routes)) {
            delete state.routeByExit[eid];
            return;
          }
          var wanted = state.routeByExit[eid];
          var exists = ex.routes.some(function (r) { return r.id === wanted; });
          if (!exists) delete state.routeByExit[eid];
        });
      }

      function startLiveRefresh() {
        if (typeof window.fetch !== "function" || typeof window.DOMParser !== "function") return;
        if (window.location.protocol !== "http:" && window.location.protocol !== "https:") return;
        var curViewSig = document.documentElement.getAttribute(REFRESH_CFG.view_attr) || "";
        var lastEtag = "";
        var lastCheckAt = 0;
        var delayMs = REFRESH_CFG.interval_ms;
        var inFlight = false;
        var timerId = null;

        function clearTimer() {
          if (timerId !== null) {
            window.clearTimeout(timerId);
            timerId = null;
          }
        }

        function schedule(ms) {
          clearTimer();
          if (document.visibilityState !== "visible") return;
          timerId = window.setTimeout(checkNow, ms);
        }

        function checkNow() {
          if (inFlight || document.visibilityState !== "visible") return;
          if (navigator.onLine === false) {
            schedule(REFRESH_CFG.interval_ms);
            return;
          }
          clearTimer();
          inFlight = true;
          lastCheckAt = Date.now();
          window.fetch(window.location.pathname, {
            method: "GET",
            cache: "no-cache",
            credentials: "same-origin"
          }).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            delayMs = REFRESH_CFG.interval_ms;
            var etag = res.headers.get("etag") || res.headers.get("last-modified") || "";
            if (etag && lastEtag && etag === lastEtag) return null;
            return res.text().then(function (htmlText) {
              return { etag: etag, htmlText: htmlText };
            });
          }).then(function (payload) {
            if (!payload) return;
            var doc = new window.DOMParser().parseFromString(payload.htmlText, "text/html");
            var nextViewSig = doc.documentElement ? (doc.documentElement.getAttribute(REFRESH_CFG.view_attr) || "") : "";
            if (nextViewSig && curViewSig && nextViewSig !== curViewSig) {
              window.location.reload();
              return;
            }
            var nextDataEl = doc.getElementById(REFRESH_CFG.data_script_id);
            if (nextDataEl && nextDataEl.textContent) {
              var nextModel = JSON.parse(nextDataEl.textContent);
              if (nextModel && Array.isArray(nextModel.exits) && nextModel.exits.length) {
                if (state.model && nextModel.schema && state.model.schema && nextModel.schema !== state.model.schema) {
                  window.location.reload();
                  return;
                }
                var nextKey = modelContentKey(nextModel);
                if (nextKey !== state.contentKey) {
                  state.contentKey = nextKey;
                  state.model = nextModel;
                  if (dataScript) dataScript.textContent = nextDataEl.textContent;
                  reconcileSelection(nextModel);
                  renderAll();
                  showUpdateNotice(nextModel.rev || "");
                } else {
                  state.model = nextModel;
                }
              }
            }
            if (payload.etag) lastEtag = payload.etag;
          }).catch(function () {
            delayMs = Math.min(delayMs * 2, REFRESH_CFG.max_backoff_ms);
          }).finally(function () {
            inFlight = false;
            schedule(delayMs);
          });
        }

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            var elapsed = Date.now() - lastCheckAt;
            if (elapsed >= REFRESH_CFG.min_gap_ms) checkNow();
            else schedule(REFRESH_CFG.min_gap_ms - elapsed);
          } else {
            clearTimer();
          }
        });

        window.addEventListener("focus", function () {
          if (document.visibilityState === "visible" && (Date.now() - lastCheckAt) >= REFRESH_CFG.min_gap_ms) {
            checkNow();
          }
        });

        window.addEventListener("online", function () {
          delayMs = REFRESH_CFG.interval_ms;
          if (document.visibilityState === "visible") checkNow();
        });

        schedule(REFRESH_CFG.interval_ms);
      }

      renderAll();
      startLiveRefresh();
    })();
  </script>
</body>
</html>
