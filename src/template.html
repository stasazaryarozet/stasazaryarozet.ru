<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — {{ author }}</title>
    <meta name="description" content="{{ meta_description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Proza+Libre:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <section class="artwork-section">
            <div class="frame-system">
                <div class="outer-frame">
                    <div class="frame-side top"></div>
                    <div class="frame-side bottom"></div>
                    <div class="frame-side left"></div>
                    <div class="frame-side right"></div>
                    <div class="slip">
                        <div class="outer-paper-mat">
                            <div class="inner-dark-mat">
                                <img id="main-artwork" src="artwork_canvas_clean.jpg" alt="{{ title }} — {{ author }}"
                                    onclick="toggleView()"
                                    style="cursor: zoom-in; box-shadow: 0 3px 8px rgba(0,0,0,0.25);">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="view-controls">
                <button class="view-btn active" onclick="switchView('framed')">{{ label_framed }}</button>
                <span style="opacity:0.3; margin: 0 0.5rem;">|</span>
                <button class="view-btn" onclick="switchView('paper')">{{ label_paper }}</button>
            </div>
        </section>
        <section class="info-panel">
            <h1 class="title">{{ title }}</h1>
            <div class="module">
                <div class="nameplate">
                    <a href="{{ author_url }}" class="author-link">{{ author }}</a>
                    <div class="year-label">{{ year }}</div>
                </div>
                <div class="price-display">
                    <div class="price-content">
                        <div class="price-value">{{ price }}</div>
                        <div class="beneficiary-note-on-card">{{ beneficiary }}</div>
                    </div>
                    <a href="mailto:azrozet@gmail.com?subject=Последний%20Шанс%20Пегаса"
                        class="buy-tab"><span>КУПИТЬ</span></a>
                </div>
                <div class="price-note">{{ price_note }}</div>
                <div class="offer-card">{{ offer_card }}</div>
                <div class="nameplate-pale">
                    <svg class="rose-icon" viewBox="0 0 3000 3000"
                        style="width: 32px; height: 32px; fill: currentColor; opacity: 0.3;">

                    </svg>
                </div>
            </div>
            <div class="module logistics">
                <p><strong>{{ label_pickup }}</strong><br>{{ pickup }}</p>
                <p style="margin-top: 0.75rem;"><strong>{{ label_delivery }}</strong><br>{{ delivery }}</p>
            </div>
            <div class="contact-area">
                <div class="contact-label">{{ label_contact }}</div>
                <a href="mailto:{{ contact_email }}" class="email-link">{{ contact_email }}</a>
                <p class="organizer">{{ contact_name }}</p>
            </div>
        </section>
    </div>
    <div id="google_translate_element" style="position:fixed;bottom:1rem;right:1rem;opacity:0.6;"></div>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'ru', includedLanguages: 'en,de,fr,zh-CN,es,ar,he', layout: google.translate.TranslateElement.InlineLayout.SIMPLE, autoDisplay: true }, 'google_translate_element');
        }
        function switchView(mode) {
            const system = document.querySelector('.frame-system');
            const btns = document.querySelectorAll('.view-btn');
            const body = document.body;
            const img = document.getElementById('main-artwork');
            if (mode === 'framed') {
                system.classList.remove('is-paper'); body.classList.remove('is-paper-mode'); btns[0].classList.add('active'); btns[1].classList.remove('active'); img.style.cursor = 'zoom-in';
            } else {
                system.classList.add('is-paper'); body.classList.add('is-paper-mode'); btns[0].classList.remove('active'); btns[1].classList.add('active'); img.style.cursor = 'zoom-out';
            }
        }
        function toggleView() {
            const system = document.querySelector('.frame-system');
            if (system.classList.contains('is-paper')) { switchView('framed'); } else { switchView('paper'); }
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div
        style="position:fixed; bottom:10px; left:10px; opacity:0.6; font-family:monospace; font-size:12px; z-index:9999; color:red; background:white; padding:2px;">
        {{ version_tag }}</div>
</body>

</html>
