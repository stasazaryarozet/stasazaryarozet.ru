<!DOCTYPE html>
<!-- TEMPLATE v2.2 - Paper Mode Fix -->
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — {{ author }}</title>
    <meta name="description"
        content="«Последний шанс» — это не метафора мифа. Это повторяющийся сценарий, за который каждый раз платится предельная цена.">

    <!-- Fonts: Standard of Excellence -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* STYLES_INJECTED_HERE */
    </style>
</head>

<body>
    <div class="container">
        <section class="artwork-section">
            <div class="frame-system">
                <div class="outer-frame">
                    <div class="frame-side top"></div>
                    <div class="frame-side bottom"></div>
                    <div class="frame-side left"></div>
                    <div class="frame-side right"></div>
                    <div class="slip">
                        <div class="outer-paper-mat">
                            <div class="inner-dark-mat">
                                <img id="main-artwork" src="artwork_canvas_clean.jpg" alt="{{ title }} — {{ author }}"
                                    onclick="toggleView()"
                                    style="cursor: zoom-in; box-shadow: 0 3px 8px rgba(0,0,0,0.25);">
                            </div>
                        </div>
                    </div>
                </div>
            </div> <!-- End frame-system -->

            <div class="view-controls">
                <button class="view-btn active" onclick="switchView('framed')">В РАМЕ</button>
                <span style="opacity:0.3; margin: 0 0.5rem;">|</span>
                <button class="view-btn" onclick="switchView('paper')">БУМАГА</button>
            </div>
        </section>

        <section class="info-panel">
            <h1 class="title">{{ title }}</h1>

            <div class="nameplate">
                <a href="{{ author_url }}" class="author-link">{{ author }}</a><br>{{ year }}
            </div>

            <div class="module">
                <!-- Price Cardboard -->
                <div class="price-container" style="text-align: center; margin-bottom: 2rem;">
                    <span class="price-display">{{ price }}</span>
                </div>
                <div class="price-note">{{ price_note }}</div>
                <div class="offer-card">{{ offer_card }}</div>
            </div>

            <!-- Beneficiary Nameplate -->
            <div class="nameplate" style="margin: 0 auto 3rem auto; display: block; width: fit-content;">
                <span style="font-weight: 800; font-size: 1.1rem; letter-spacing: 0.15em;">{{ beneficiary }}</span>
            </div>

            <div class="module logistics">
                <p><strong>САМОВЫВОЗ:</strong><br>{{ pickup }}</p>
                <p style="margin-top: 0.75rem;"><strong>ДОСТАВКА:</strong><br>{{ delivery }}</p>
            </div>

            <div class="contact-area">
                <div class="contact-label">Связь:</div>
                <a href="mailto:{{ contact_email }}" class="email-link">{{ contact_email }}</a>
                <p class="organizer">{{ contact_name }}</p>
            </div>
        </section>
    </div>

    <div id="google_translate_element" style="position:fixed;bottom:1rem;right:1rem;opacity:0.6;"></div>

    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'en,de,fr,zh-CN,es,ar,he',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: true
            }, 'google_translate_element');
        }

        function switchView(mode) {
            const system = document.querySelector('.frame-system');
            const btns = document.querySelectorAll('.view-btn');
            const body = document.body;
            const img = document.getElementById('main-artwork');

            if (mode === 'framed') {
                system.classList.remove('is-paper');
                body.classList.remove('is-paper-mode');
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
                img.style.cursor = 'zoom-in';
            } else {
                system.classList.add('is-paper');
                body.classList.add('is-paper-mode');
                btns[0].classList.remove('active');
                btns[1].classList.add('active');
                img.style.cursor = 'zoom-out';
            }
        }

        function toggleView() {
            const system = document.querySelector('.frame-system');
            if (system.classList.contains('is-paper')) {
                switchView('framed');
            } else {
                switchView('paper');
            }
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div
        style="position:fixed; bottom:10px; left:10px; opacity:0.6; font-family:monospace; font-size:12px; z-index:9999; color:red; background:white; padding:2px;">
        v.AUTO-DEPLOYED</div>
</body>

</html>
