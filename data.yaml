# azaryarozet site SoT (seed 2026-07-19, shkolyar по директиве публикации fcac6fcc).
# Минимум истинных полей: рендер статических страниц (p_static_page) + canonical.
# Расширяется владельцем/по директивам; НЕ копия olgarozet-схемы (No-Stubs).
lang: ru
bio:
  title: Азарья Розет
  # canonical живёт в bio.* — путь, который читает site_generator._canonical
  # (схема корпуса: olgarozet то же); = domains.primary(azaryarozet).
  canonical: https://stasazaryarozet.ru
# Дело о репатриации — ОБЪЕКТ (admin 2026-08-07/08: «сквозная выводимость от файла Системы
# как проекции с конкретными параметрами»). Род объявлен entity-event; дом — этот файл
# (enforcement_data.scope самой Спеки). Порядок — t_key; страница — p_event_landing по
# id-адресу (рукописный site/<uuid>.md УДАЛЁН: «graph-derived wins» — закон эмиссии).
# broadcast: [landing] у родителя = лендинг ЕСТЬ, листинга на индексе НЕТ (слово рода
# добавлено в surface_taxonomy 2026-08-08); [landing_section] у под-событий = строка
# таймлайна в лендинге родителя; [] значило бы «только граф». Приватность — этим гейтом
# ПО-СОБЫТИЙНО, не вырезанием прозы. _source на каждом — Inv-EV-source-organizer-verified;
# имена — claims/raw в knowledge/projects/israel-passports/.
events:
  - id: 13642c68-889c-4711-a4ae-a8be28e72c7c
    type: case
    title: Израильские паспорта — ход дела
    broadcast: [landing]
    t_key: "2026-01-05"
    # ЛУЧ ОБЪЯВЛЕН ЯВНО (Σ tellus 2026-09-03, entity-event.md §horizon): дело ИДЁТ — конец у
    # него есть и в горизонте страницы не наступит. Прежде это держалось ОТСУТСТВИЕМ `t_end`,
    # а отсутствие значило два противоположных «точка» ∪ «луч» — и различала их рука. Как
    # только стадия стала тотальной по времени, нераспознанный луч прочёлся точкой 5 января и
    # унёс бы весь лендинг дела с сайта. Токен — `end_open_token` Спеки.
    t_end: open
    status: ONGOING
    _source: "бриф админа d50fb781 (raw admin-brief-israel-passports-2026-08-05)"
    lead: >-
      Семеро заявителей. Основание — материнская линия Марии; Азарья идёт супругом.
      Эстер ведёт собственное дело и ушла вперёд: её принятый пакет служит остальным
      проверенной спецификацией. Ниже — кто что делает, что открыто и что уже произошло;
      страница выведена из графа Системы и обновляется вместе с ним.
    # sections[] — схема entity-event (event_schema.Section): title + text | pairs | items.
    # `body` схемой НЕ ЗНАЕТ: секция с одним title есть title-only sentinel, который
    # рендерится ПУСТЫМ (и глушит одноимённый авто-блок). До 2026-08-09 обе секции стояли
    # под `body` — то есть выводимая страница молча теряла оба среза, а живая держалась
    # рукописной. pairs — потому что и распределение, и комментарии суть ОТНОШЕНИЯ
    # (носитель → его доля; тезис → его развёртка), а не абзацы: адресуемо пофрагментно
    # (surface_relevant правит лист, а не простыню) и рендерится <dl>, а не прозой.
    sections:
      - title: Распределение задач
        pairs:
          - label: Принципал
            text: >-
              Сканы пяти загранпаспортов · походы в ЗАГС и МФЦ · фотосъёмка · вся связь
              с Эстер и семьёй. Физические акты; и единственный канал к семье — политика дела.
          - label: Эстер
            text: >-
              Личная явка в отдел ЗАГС с уплаченными квитанциями · ответы на семь вопросов.
              Её документ, её часы, её принятый пакет.
          - label: Рут
            text: >-
              Помощь по мелким подзадачам. Объявлено принципалом 05.08; конкретика
              назначается им же.
          - label: Система
            text: >-
              Первоисточники права · проверка апостилей по сканам · опись мест учёбы и
              работы · подготовка данных для шести анкет · наблюдение деловых каналов.
              Всё, что не требует присутствия человека.
        _source: "plans/israel-passports-action.md §Ресурс + admin 05.08 (роль Рут)"
      - title: Несводимое
        text: >-
          Не может быть снято никакой автоматикой: одна консульская явка всех шестерых,
          подписи, биометрия, вылет. Задача Системы — не устранить эти события, а сделать
          так, чтобы их число не росло: один поход вместо четырёх, одна съёмка на шестерых,
          одна явка.

          Счёт усилия. Три-четыре события до консула, затем одна явка и одно окно вылета.
          Константа не растёт с числом людей — растёт только от числа отложенных решений.
        _source: "plans/israel-passports-action.md §Ресурс"
      - title: Комментарии
        pairs:
          - label: Самый дешёвый ход
            text: >-
              Одно сообщение Эстер закрывает сразу несколько неизвестных: срок визы,
              принятый список документов, формат фото, нужны ли переводы, куда доносить
              свидетельство, ответ по эскалациям — и главное, принимали ли у неё советские
              свидетельства без апостиля. Последний вопрос снимает целый шаг для Марии и Азарьи.
          - label: Что меняет виза Эстер
            text: >-
              Стадия решения по ней пройдена; не пройдена реализация визы — въезд в срок её
              действия. Это единственные часы задачи, идущие независимо от участников, и срок
              их неизвестен.
          - label: Почему шесть недель
            text: >-
              Повторное свидетельство при личном обращении в орган ЗАГС выдаётся в день
              обращения; тридцать дней — регламент письменного и электронного запроса. Портал
              mos.ru и есть электронная полоса. Дважды встали в неё и дважды ждали. Это не
              поломка ведомства и не чья-то невнимательность — выбран не тот канал.
          - label: Линия задокументирована по звеньям
            text: >-
              Четыре поколения, цепь непрерывна по матерям, все акты на руках либо
              перевыпущены. Поэтому речь о евреях по рождению, а не о внуках еврея. Одно звено
              слабее прочих из-за советской паспортной записи, но оно перекрыто документом
              ярусом выше, и консульская проверка Эстер это уже приняла.
          - label: Линия Азарьи закрыта — установлено, а не предположено
            text: >-
              Его собственное свидетельство о рождении не даёт основания. Поэтому дело идёт
              линией Марии, а он — супругом; брак заключён до репатриации, что делает
              супружеское основание чистым.
          - label: Скан — ещё не документ
            text: >-
              У документа три независимые грани: содержание известно · оригинал на руках ·
              приемлем (апостиль, износ, срок, цепь имени). Система устанавливает только
              первую. Шесть недель Эстер — ровно этот коллапс: скан её свидетельства читался
              прекрасно, а оригинал был затёртый и без апостиля.
          - label: Что остаётся неизвестным
            text: >-
              Сроки действия пяти загранпаспортов · до какого числа действует виза Эстер ·
              формат фото (источники расходятся) · нужны ли переводы · требуется ли апостиль
              на бланки до 1998 года · маршрут апостиля на справку о несудимости · состояние
              оригиналов на руках.
          - label: Намерение
            text: >-
              Виза репатрианта выдаётся для поселения, и консул вправе спросить о намерении.
              Состав заявителей определяется намерением семьи, а не очередью в ЗАГС.
        _source: "plans/israel-passports-action.md (перегенерация по пометкам 07481c0658)"

