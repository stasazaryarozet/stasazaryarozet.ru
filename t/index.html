<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
<meta content="light dark" name="color-scheme"/>
<meta content="0; url=/tunnels/" http-equiv="refresh"/>
<title>Тоннели</title>
<link href="/_tokens.generated.css" rel="stylesheet"/>
<style>
    @layer owner {
      html, body {
        margin: 0; padding: clamp(16px, 4vw, 32px);
        background: var(--bg); color: var(--ink);
        font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      }
      a { color: var(--accent); }
    }
  </style>
<script>
    (function () {
      var THEME_KEY = "theme.v1";
      var THEME_ATTR = "data-theme";
      var DAY_VAL = "day";
      var NIGHT_VAL = "night";
      window.__applyTheme = function (t) {
        var v = (t === DAY_VAL || t === NIGHT_VAL) ? t
          : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? NIGHT_VAL : DAY_VAL);
        document.documentElement.setAttribute(THEME_ATTR, v);
      };
      try { window.__applyTheme(localStorage.getItem(THEME_KEY) || ""); } catch (_e) { window.__applyTheme(""); }
      var tail = (window.location.search || "") + (window.location.hash || "");
      var target = "/tunnels/" + tail;
      if (window.location.pathname !== "/tunnels/") {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
<main>
<p><a href="/tunnels/">Перейти к тоннелям</a></p>
</main>
</body>
</html>
